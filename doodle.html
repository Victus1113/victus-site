<!DOCTYPE html>
<html lang="zh">

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta charset="UTF-8">
<title>Doodle</title>
<link rel="stylesheet" href="style.css">

<style>

/* ===== Viewer 改回全螢幕 ===== */
#viewer{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,0.95);

    display:none;
    align-items:center;
    justify-content:center;

    z-index:9999;
}

/* 圖片完整顯示 */
#viewer img{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;

    transition:0.3s;
}

/* ===== 箭頭 ===== */
#prev, #next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);

    font-size:40px;
    color:white;

    padding:20px;
    cursor:pointer;

    opacity:0.6;
    z-index:10;
}

/* ⭐ 關鍵：確保一定在畫面內 */
#prev{ left:5vw; }
#next{ right:5vw; }

#prev:hover, #next:hover{
    opacity:1;
}

/* ===== 關閉 ===== */
#close{
    position:absolute;
    top:20px;
    right:20px;

    font-size:28px;
    color:white;

    cursor:pointer;
}

/* ===== 頁數 ===== */
#counter{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);

    color:#ccc;
}

/* ===== 手機優化 ===== */
@media (max-width:768px){

#viewer img{
    max-width:100%;
    max-height:75vh;
}

/* 箭頭縮小但一定可見 */
#prev, #next{
    font-size:30px;
    padding:10px;
}

#prev{ left:10px; }
#next{ right:10px; }

}

</style>
</head>

<body>

<div class="page">

<h1>插圖 DOODLE</h1>
<p>角色塗鴉＆小漫畫。</p>

<h2>插圖</h2>
<div class="gallery">
    <img src="img/members.jpg">
    <img src="img/sh.jpg">
</div>

<h2>漫畫</h2>
<div class="gallery">
    <img src="img/humor.jpg">
    <img src="img/s3x.jpg">
    <img src="img/cure.jpg">
    <img src="img/speachless.jpg">
</div>

<a class="back" href="index.html">← 回到首頁</a>

</div>

<!-- Viewer -->
<div id="viewer">

    <div id="close">✕</div>

    <div id="prev">‹</div>

    <img id="bigImage">

    <div id="next">›</div>

    <div id="counter">1 / 1</div>

</div>

<script>

const viewer = document.getElementById("viewer");
const bigImage = document.getElementById("bigImage");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const closeBtn = document.getElementById("close");
const counter = document.getElementById("counter");

const galleries = document.querySelectorAll(".gallery");

let currentIndex = 0;
let currentGallery = [];

/* ===== 狀態 ===== */
let scale = 1;
let posX = 0;
let posY = 0;

let velocityX = 0;
let velocityY = 0;

let isDragging = false;
let startX = 0;
let startY = 0;

let initialDistance = null;

let touchStartX = 0;
let touchStartY = 0;
let isMoved = false;

let isTouchDevice = false;
let justTouched = false; // ⭐ 防誤觸鎖
let lastTapTime = 0; // ✅ 補這

/* ===== 更新 ===== */
function updateTransform(){
    bigImage.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
}

/* ===== 邊界 ===== */
function clamp(){
    const rect = bigImage.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const maxX = (rect.width - vw)/2;
    const maxY = (rect.height - vh)/2;

    posX = maxX > 0 ? Math.min(maxX, Math.max(-maxX, posX)) : 0;
    posY = maxY > 0 ? Math.min(maxY, Math.max(-maxY, posY)) : 0;
}

/* ===== 慣性 ===== */
function inertia(){
    velocityX *= 0.95;
    velocityY *= 0.95;

    posX += velocityX;
    posY += velocityY;

    clamp();
    updateTransform();

    if(Math.abs(velocityX)>0.1 || Math.abs(velocityY)>0.1){
        requestAnimationFrame(inertia);
    }
}

/* ===== 切圖 ===== */
function goPrev(){
    currentIndex = (currentIndex-1+currentGallery.length)%currentGallery.length;
    showImage();
}
function goNext(){
    currentIndex = (currentIndex+1)%currentGallery.length;
    showImage();
}

/* ===== 開啟 ===== */
galleries.forEach(gallery=>{
    const imgs = gallery.querySelectorAll("img");

    imgs.forEach((img,index)=>{
        img.onclick = ()=>{
            currentGallery = imgs;
            currentIndex = index;

            showImage();
            viewer.style.display="flex";
            document.body.style.overflow="hidden";
        }
    });
});

/* ===== 顯示 ===== */
function showImage(){
    bigImage.src = currentGallery[currentIndex].src;

    scale = 1; // ⭐ 加這行
    posX=0; posY=0;
    velocityX=0; velocityY=0;

    updateTransform();
    counter.innerText = (currentIndex+1)+" / "+currentGallery.length;
}

/* ===== 關閉 ===== */
function closeViewer(){
    viewer.style.display="none";
    document.body.style.overflow="";
}

closeBtn.onclick = e=>{
    e.stopPropagation();
    closeViewer();
};

/* ===== 箭頭（桌機） ===== */
prev.onclick = e=>{ e.stopPropagation(); goPrev(); }
next.onclick = e=>{ e.stopPropagation(); goNext(); }

/*===防止「手機點擊變成 click 觸發」 ===== */
    
prev.addEventListener("click", e=>{
    if('ontouchstart' in window) return; // ⭐ 手機直接無效
    e.stopPropagation();
    goPrev();
});

next.addEventListener("click", e=>{
    if('ontouchstart' in window) return; // ⭐ 手機直接無效
    e.stopPropagation();
    goNext();
});

/* ===== 鍵盤 ===== */
document.addEventListener("keydown", e=>{
    if(viewer.style.display!=="flex") return;
    if(scale>1) return;

    if(e.key==="ArrowLeft") goPrev();
    if(e.key==="ArrowRight") goNext();
});

/* ===== 滾輪縮放（桌機） ===== */
bigImage.addEventListener("wheel", e=>{
    e.preventDefault();

    let oldScale = scale;
    scale += e.deltaY<0?0.15:-0.15;
    scale = Math.min(Math.max(1,scale),4);

    const rect = bigImage.getBoundingClientRect();
    const ratio = scale/oldScale;

    posX -= (e.clientX-rect.left-rect.width/2)*(ratio-1);
    posY -= (e.clientY-rect.top-rect.height/2)*(ratio-1);

    clamp();
    updateTransform();
});

/* ===== 滑鼠拖曳（桌機） ===== */
bigImage.addEventListener("mousedown", e=>{
    if(scale<=1) return;

    isDragging=true;
    velocityX=0; velocityY=0;

    startX=e.clientX;
    startY=e.clientY;
});

window.addEventListener("mousemove", e=>{
    if(!isDragging) return;

    let dx=e.clientX-startX;
    let dy=e.clientY-startY;

    posX+=dx; posY+=dy;
    velocityX=dx; velocityY=dy;

    startX=e.clientX;
    startY=e.clientY;

    clamp();
    updateTransform();
});

window.addEventListener("mouseup", ()=>{
    if(isDragging){
        isDragging=false;
    }
});

/* ======================================
   手機觸控（最終優化版）
   ✔ 超順滑
   ✔ 有預覽
   ✔ 無卡頓
====================================== */

let isSwiping = false;
let swipeOffsetX = 0;

viewer.addEventListener("touchstart", e=>{

    if(e.touches.length===1){
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;

        touchStartX = startX;
        touchStartY = startY;

        isSwiping = false;
    }

    if(e.touches.length===2){
        let dx = e.touches[0].clientX - e.touches[1].clientX;
        let dy = e.touches[0].clientY - e.touches[1].clientY;
        initialDistance = Math.sqrt(dx*dx + dy*dy);
    }
});

viewer.addEventListener("touchmove", e=>{

    /* ===== 雙指縮放 ===== */
    if(e.touches.length===2){

        if(!initialDistance) return;

        e.preventDefault();

        let dx = e.touches[0].clientX - e.touches[1].clientX;
        let dy = e.touches[0].clientY - e.touches[1].clientY;

        let distance = Math.sqrt(dx*dx + dy*dy);
        let ratio = distance / initialDistance;

        scale = Math.min(Math.max(1, scale * ratio), 4);
        initialDistance = distance;

        clamp();
        updateTransform();
    }

    /* ===== 單指 ===== */
    if(e.touches.length===1){

        let touch = e.touches[0];
        let dx = touch.clientX - touchStartX;

        /* 👉 滑動預覽（重點優化） */
        if(scale === 1){

            if(Math.abs(dx) > 10){
                isSwiping = true;

                // ⭐ 用 transform 系統（不卡頓）
                posX = dx;
                posY = 0;
                updateTransform();
            }
        }

        /* 👉 放大拖曳 */
        if(scale > 1){
            e.preventDefault();

            let moveX = touch.clientX - startX;
            let moveY = touch.clientY - startY;

            posX += moveX;
            posY += moveY;

            startX = touch.clientX;
            startY = touch.clientY;

            clamp();
            updateTransform();
        }
    }

}, {passive:false});

viewer.addEventListener("touchend", e=>{

    const now = Date.now();
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;

    /* =====================
       1️⃣ 雙擊放大
    ===================== */
    if(now - lastTapTime < 250){

        if(scale === 1){
            scale = 2;
        }else{
            scale = 1;
            posX = 0;
            posY = 0;
        }

        updateTransform();
        lastTapTime = 0;
        return;
    }

    lastTapTime = now;

    /* =====================
       2️⃣ 滑動切圖（有預覽）
    ===================== */
    if(scale === 1 && isSwiping){

        if(dx > 80){
            goPrev();
        }else if(dx < -80){
            goNext();
        }

        // ⭐ 回彈（用 transform 系統）
        posX = 0;
        posY = 0;

        bigImage.style.transition = "transform 0.2s ease";
        updateTransform();

        setTimeout(()=>{
            bigImage.style.transition = "";
        },200);

        return;
    }

    /* =====================
       3️⃣ 點背景關閉（手機）
    ===================== */
    if(scale === 1){

        if(
            touch.target !== bigImage &&
            touch.target.id !== "prev" &&
            touch.target.id !== "next" &&
            touch.target.id !== "close"
        ){
            closeViewer();
        }
    }

});

/* ======================================
  電腦點擊背景退出圖片
====================================== */
    
viewer.addEventListener("click", e=>{
    if(
        e.target === bigImage ||
        e.target.id === "prev" ||
        e.target.id === "next" ||
        e.target.id === "close"
    ) return;

    closeViewer();
});    
    
</script>

</body>
</html>
