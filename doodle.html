<!DOCTYPE html>
<html lang="zh">

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta charset="UTF-8">
<title>Doodle</title>
<link rel="stylesheet" href="style.css">

<style>

/* ===== Viewer 全螢幕 ===== */
#viewer{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,0.95);

    display:none;
    align-items:center;
    justify-content:center;

    z-index:9999;

    /* 手機觸控最佳化 */
    touch-action:none;
}

/* ===== 圖片完整顯示 ===== */
#viewer img{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;

    transition:0.3s;

    /* 避免手機拖曳時瀏覽器介入 */
    touch-action:none;

    /* 避免圖片被瀏覽器原生拖走 */
    user-select:none;
    -webkit-user-drag:none;
}

/* ===== 箭頭 ===== */
#prev, #next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);

    font-size:40px;
    color:white;

    padding:20px;
    cursor:pointer;

    opacity:0.6;
    z-index:10;

    user-select:none;
}

#prev{ left:5vw; }
#next{ right:5vw; }

#prev:hover, #next:hover{
    opacity:1;
}

/* ===== 關閉 ===== */
#close{
    position:absolute;
    top:20px;
    right:20px;

    font-size:28px;
    color:white;

    cursor:pointer;
    z-index:10;

    user-select:none;
}

/* ===== 頁數 ===== */
#counter{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);

    color:#ccc;
    z-index:10;

    user-select:none;
}

/* ===== 手機優化 ===== */
@media (max-width:768px){

    #viewer img{
        max-width:100%;
        max-height:75vh;
    }

    #prev, #next{
        font-size:30px;
        padding:10px;
    }

    #prev{ left:10px; }
    #next{ right:10px; }

}

</style>
</head>

<body>

<div class="page">

<h1>插圖 DOODLE</h1>
<p>角色塗鴉＆小漫畫。</p>

<h2>插圖</h2>
<div class="gallery">
    <img src="img/members.jpg">
    <img src="img/sh.jpg">
</div>

<h2>漫畫</h2>
<div class="gallery">
    <img src="img/humor.jpg">
    <img src="img/s3x.jpg">
    <img src="img/cure.jpg">
    <img src="img/speachless.jpg">
</div>

<a class="back" href="index.html">← 回到首頁</a>

</div>

<!-- Viewer -->
<div id="viewer">

    <div id="close">✕</div>

    <div id="prev">‹</div>

    <img id="bigImage" draggable="false">

    <div id="next">›</div>

    <div id="counter">1 / 1</div>

</div>

<script>

const viewer = document.getElementById("viewer");
const bigImage = document.getElementById("bigImage");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const closeBtn = document.getElementById("close");
const counter = document.getElementById("counter");

const galleries = document.querySelectorAll(".gallery");

let currentIndex = 0;
let currentGallery = [];

let previewPrev = new Image();
let previewNext = new Image();

/* ======================================
   狀態
====================================== */

let scale = 1;

let posX = 0;
let posY = 0;

let velocityX = 0;
let velocityY = 0;

let isDragging = false;

let startX = 0;
let startY = 0;

let initialDistance = null;

let touchStartX = 0;
let touchStartY = 0;

let isSwiping = false;

let lastTapTime = 0;

/* ⭐ 雙指中心點 */
let lastCenterX = null;
let lastCenterY = null;

/* ⭐ 防止 touch 後產生多餘 click */
let justTouched = false;


/* ======================================
   更新圖片位置
====================================== */

function updateTransform(){

    bigImage.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;

}


/* ======================================
   邊界限制
====================================== */

function clamp(){

    const rect = bigImage.getBoundingClientRect();

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const maxX = Math.max(0, (rect.width - vw) / 2);
    const maxY = Math.max(0, (rect.height - vh) / 2);

    posX = Math.min(maxX, Math.max(-maxX, posX));
    posY = Math.min(maxY, Math.max(-maxY, posY));

}


/* ======================================
   慣性
====================================== */

function inertia(){

    velocityX *= 0.95;
    velocityY *= 0.95;

    posX += velocityX;
    posY += velocityY;

    clamp();
    updateTransform();

    if(
        Math.abs(velocityX) > 0.1 ||
        Math.abs(velocityY) > 0.1
    ){
        requestAnimationFrame(inertia);
    }

}


/* ======================================
   切圖
====================================== */

function goPrev(){

    currentIndex =
        (currentIndex - 1 + currentGallery.length)
        % currentGallery.length;

    showImage();

}


function goNext(){

    currentIndex =
        (currentIndex + 1)
        % currentGallery.length;

    showImage();

}


/* ======================================
   開啟圖片
====================================== */

galleries.forEach(gallery=>{

    const imgs = gallery.querySelectorAll("img");

    imgs.forEach((img,index)=>{

        img.addEventListener("click", ()=>{

            currentGallery = imgs;
            currentIndex = index;

            showImage();

            viewer.style.display = "flex";

            document.body.style.overflow = "hidden";

        });

    });

});


/* ======================================
   顯示圖片
====================================== */

function showImage(){

    bigImage.src = currentGallery[currentIndex].src;

    /* ⭐ 預載前後圖 */

    const prevIndex =
        (currentIndex - 1 + currentGallery.length)
        % currentGallery.length;

    const nextIndex =
        (currentIndex + 1)
        % currentGallery.length;

    previewPrev.src = currentGallery[prevIndex].src;
    previewNext.src = currentGallery[nextIndex].src;

    /* ⭐ 重置圖片狀態 */

    scale = 1;

    posX = 0;
    posY = 0;

    velocityX = 0;
    velocityY = 0;

    isDragging = false;
    isSwiping = false;

    initialDistance = null;

    lastCenterX = null;
    lastCenterY = null;

    /* ⭐ 清除背景預覽 */

    viewer.style.backgroundImage = "";

    updateTransform();

    counter.innerText =
        (currentIndex + 1) + " / " + currentGallery.length;

}


/* ======================================
   關閉 Viewer
====================================== */

function closeViewer(){

    viewer.style.display = "none";

    document.body.style.overflow = "";

    /* ⭐ 清除背景預覽 */

    viewer.style.backgroundImage = "";

    /* ⭐ 重置雙指中心 */

    lastCenterX = null;
    lastCenterY = null;

    /* ⭐ 重置觸控狀態 */

    initialDistance = null;
    isSwiping = false;
    isDragging = false;

}


/* ======================================
   關閉按鈕
====================================== */

closeBtn.addEventListener("click", e=>{

    e.stopPropagation();

    closeViewer();

});


/* ======================================
   電腦左右箭頭
====================================== */

prev.addEventListener("click", e=>{

    e.stopPropagation();

    if(scale > 1) return;

    goPrev();

});


next.addEventListener("click", e=>{

    e.stopPropagation();

    if(scale > 1) return;

    goNext();

});


/* ======================================
   鍵盤左右切圖
====================================== */

document.addEventListener("keydown", e=>{

    if(viewer.style.display !== "flex") return;

    if(scale > 1) return;

    if(e.key === "ArrowLeft"){

        e.preventDefault();
        goPrev();

    }

    if(e.key === "ArrowRight"){

        e.preventDefault();
        goNext();

    }

});


/* ======================================
   電腦滾輪縮放
====================================== */

bigImage.addEventListener("wheel", e=>{

    e.preventDefault();

    const oldScale = scale;

    scale += e.deltaY < 0 ? 0.15 : -0.15;

    scale = Math.min(Math.max(1, scale), 4);

    const rect = bigImage.getBoundingClientRect();

    const ratio = scale / oldScale;

    posX -=
        (e.clientX - rect.left - rect.width / 2)
        * (ratio - 1);

    posY -=
        (e.clientY - rect.top - rect.height / 2)
        * (ratio - 1);

    clamp();

    updateTransform();

});


/* ======================================
   電腦滑鼠拖曳
====================================== */

bigImage.addEventListener("mousedown", e=>{

    if(scale <= 1) return;

    isDragging = true;

    velocityX = 0;
    velocityY = 0;

    startX = e.clientX;
    startY = e.clientY;

});


window.addEventListener("mousemove", e=>{

    if(!isDragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    posX += dx;
    posY += dy;

    velocityX = dx;
    velocityY = dy;

    startX = e.clientX;
    startY = e.clientY;

    clamp();

    updateTransform();

});


window.addEventListener("mouseup", ()=>{

    if(isDragging){

        isDragging = false;

    }

});


/* ======================================
   手機觸控
====================================== */


/* ===== Touch Start ===== */

viewer.addEventListener("touchstart", e=>{

    justTouched = true;

    /* ⭐ 單指 */

    if(e.touches.length === 1){

        const touch = e.touches[0];

        startX = touch.clientX;
        startY = touch.clientY;

        touchStartX = touch.clientX;
        touchStartY = touch.clientY;

        isSwiping = false;

        /* ⭐ 如果已經放大，準備單指拖移 */

        if(scale > 1){

            isDragging = true;

        }

    }


    /* ⭐ 雙指 */

    if(e.touches.length === 2){

        e.preventDefault();

        const dx =
            e.touches[0].clientX -
            e.touches[1].clientX;

        const dy =
            e.touches[0].clientY -
            e.touches[1].clientY;

        initialDistance = Math.sqrt(dx * dx + dy * dy);

        /* ⭐ 雙指中心點 */

        lastCenterX =
            (e.touches[0].clientX +
             e.touches[1].clientX) / 2;

        lastCenterY =
            (e.touches[0].clientY +
             e.touches[1].clientY) / 2;

    }

}, {passive:false});


/* ===== Touch Move ===== */

viewer.addEventListener("touchmove", e=>{

    /* ==================================
       雙指：縮放 + 中心點拖移
    ================================== */

    if(e.touches.length === 2){

        e.preventDefault();

        if(!initialDistance) return;

        const dx =
            e.touches[0].clientX -
            e.touches[1].clientX;

        const dy =
            e.touches[0].clientY -
            e.touches[1].clientY;

        const distance = Math.sqrt(dx * dx + dy * dy);

        const ratio = distance / initialDistance;

        const centerX =
            (e.touches[0].clientX +
             e.touches[1].clientX) / 2;

        const centerY =
            (e.touches[0].clientY +
             e.touches[1].clientY) / 2;

        /* ⭐ 雙指中心點移動 */

        if(lastCenterX !== null){

            posX += centerX - lastCenterX;
            posY += centerY - lastCenterY;

        }

        /* ⭐ 雙指縮放 */

        scale = Math.min(
            Math.max(1, scale * ratio),
            4
        );

        initialDistance = distance;

        lastCenterX = centerX;
        lastCenterY = centerY;

        clamp();

        updateTransform();

        return;

    }


    /* ==================================
       單指
    ================================== */

    if(e.touches.length === 1){

        const touch = e.touches[0];

        const dx =
            touch.clientX - touchStartX;


        /* ⭐ 未放大：左右滑動預覽 */

        if(scale === 1){

            if(Math.abs(dx) > 10){

                isSwiping = true;

                posX = dx;
                posY = 0;

                updateTransform();

                /* ⭐ 顯示左右預覽圖 */

                viewer.style.backgroundImage = `
                    url(${previewPrev.src}),
                    url(${previewNext.src})
                `;

                viewer.style.backgroundRepeat =
                    "no-repeat, no-repeat";

                viewer.style.backgroundPosition = `
                    calc(50% + ${dx - window.innerWidth}px) center,
                    calc(50% + ${dx + window.innerWidth}px) center
                `;

                viewer.style.backgroundSize =
                    "contain, contain";

            }

        }


        /* ⭐ 放大後：單指拖移 */

        if(scale > 1){

            e.preventDefault();

            const moveX = touch.clientX - startX;
            const moveY = touch.clientY - startY;

            posX += moveX;
            posY += moveY;

            startX = touch.clientX;
            startY = touch.clientY;

            clamp();

            updateTransform();

        }

    }

}, {passive:false});


/* ===== Touch End ===== */

viewer.addEventListener("touchend", e=>{

    const now = Date.now();

    const touch = e.changedTouches[0];

    const dx =
        touch.clientX - touchStartX;


    /* ⭐ 雙指中心點重置 */

    lastCenterX = null;
    lastCenterY = null;

    initialDistance = null;


    /* ==================================
       1️⃣ 雙擊放大／縮小
    ================================== */

    if(now - lastTapTime < 250){

        if(scale === 1){

            scale = 2;

        }else{

            scale = 1;

            posX = 0;
            posY = 0;

        }

        updateTransform();

        lastTapTime = 0;

        return;

    }

    lastTapTime = now;


    /* ==================================
       2️⃣ 滑動切圖
    ================================== */

    if(scale === 1 && isSwiping){

        if(dx > 80){

            goPrev();

        }else if(dx < -80){

            goNext();

        }

        posX = 0;
        posY = 0;

        viewer.style.backgroundImage = "";

        bigImage.style.transition =
            "transform 0.2s ease";

        updateTransform();

        setTimeout(()=>{

            bigImage.style.transition = "";

        },200);

        isSwiping = false;

        return;

    }


    /* ==================================
       3️⃣ 點擊黑背景關閉
    ================================== */

    if(scale === 1){

        if(touch.target === viewer){

            e.preventDefault();
            e.stopPropagation();

            closeViewer();

        }

    }


    /* ⭐ 結束拖曳 */

    isDragging = false;

});


/* ======================================
   電腦點擊黑背景退出
====================================== */

viewer.addEventListener("click", e=>{

    if(
        e.target === bigImage ||
        e.target.id === "prev" ||
        e.target.id === "next" ||
        e.target.id === "close"
    ){

        return;

    }

    closeViewer();

});


</script>

</body>
</html>
