<!DOCTYPE html>
<html lang="zh">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    
<meta charset="UTF-8">
<title>Doodle</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="page">

<h1>插圖 DOODLE</h1>

<p>
角色塗鴉＆小漫畫。
</p>

<h2>插圖</h2>

<div class="gallery">
    <img src="img/members.jpg">
    <img src="img/sh.jpg">
</div>

<h2>漫畫</h2>

<div class="gallery">
    <img src="img/humor.jpg">
    <img src="img/s3x.jpg">
    <img src="img/cure.jpg">
    <img src="img/speachless.jpg">
</div>

<a class="back" href="index.html">← 回到首頁</a>

</div>


<!-- 圖片放大查看器 -->
<div id="viewer">
    
    <div id="close">✕</div>
    
    <div id="prev">‹</div>

    <img id="bigImage">

    <div id="next">›</div>

    <div id="counter">1 / 1</div>

</div>


<script>

const closeBtn = document.getElementById("close");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const counter = document.getElementById("counter");

const galleries = document.querySelectorAll(".gallery");
const viewer = document.getElementById("viewer");
const bigImage = document.getElementById("bigImage");

let currentIndex = 0;
let currentGallery = [];

/* ===== 狀態 ===== */

let scale = 1;
let posX = 0;
let posY = 0;

let velocityX = 0;
let velocityY = 0;

let isDragging = false;
let startX = 0;
let startY = 0;

let initialDistance = null;
let isMoved = false;

/* ===== 更新 transform ===== */

function updateTransform(){
    bigImage.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;
}

/* ===== 邊界限制 ===== */

function clampPosition(){

    const rect = bigImage.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const maxX = (rect.width - vw) / 2;
    const maxY = (rect.height - vh) / 2;

    posX = maxX > 0 ? Math.min(maxX, Math.max(-maxX, posX)) : 0;
    posY = maxY > 0 ? Math.min(maxY, Math.max(-maxY, posY)) : 0;
}

/* ===== 慣性 ===== */

function inertia(){

    velocityX *= 0.95;
    velocityY *= 0.95;

    posX += velocityX;
    posY += velocityY;

    clampPosition();
    updateTransform();

    if(Math.abs(velocityX) > 0.1 || Math.abs(velocityY) > 0.1){
        requestAnimationFrame(inertia);
    }
}

/* ===== 點圖片 ===== */

galleries.forEach(gallery => {

    const imgs = gallery.querySelectorAll("img");

    imgs.forEach((img, index) => {

        img.onclick = function(){
            currentGallery = imgs;
            currentIndex = index;

            showImage();
            viewer.style.display = "flex";
            document.body.style.overflow = "hidden";
        }

    });

});

/* ===== 顯示圖片 ===== */

function showImage(){
    bigImage.src = currentGallery[currentIndex].src;

    scale = 1;
    posX = 0;
    posY = 0;
    velocityX = 0;
    velocityY = 0;

    updateTransform();

    counter.innerText = (currentIndex + 1) + " / " + currentGallery.length;
}

/* ===== 關閉 ===== */

closeBtn.onclick = function(e){
    e.stopPropagation();
    viewer.style.display = "none";
    document.body.style.overflow = "";
}

/* ===== 左右 ===== */

prev.onclick = function(e){
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
    showImage();
}

next.onclick = function(e){
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % currentGallery.length;
    showImage();
}

/* ===== 鍵盤 ===== */

document.addEventListener("keydown", function(e){

    if(viewer.style.display !== "flex") return;

    if(e.key === "ArrowLeft"){
        currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
        showImage();
    }

    if(e.key === "ArrowRight"){
        currentIndex = (currentIndex + 1) % currentGallery.length;
        showImage();
    }

});

/* ===== 滾輪縮放 ===== */

bigImage.addEventListener("wheel", function(e){
    e.preventDefault();

    let prevScale = scale;

    scale += e.deltaY < 0 ? 0.1 : -0.1;
    scale = Math.min(Math.max(1, scale), 4);

    const rect = bigImage.getBoundingClientRect();
    const ratio = scale / prevScale;

    posX -= (e.clientX - rect.left - rect.width/2) * (ratio - 1);
    posY -= (e.clientY - rect.top - rect.height/2) * (ratio - 1);

    clampPosition();
    updateTransform();
});

/* ===== 滑鼠拖曳 ===== */

bigImage.addEventListener("mousedown", e => {
    if(scale <= 1) return;

    isDragging = true;
    velocityX = 0;
    velocityY = 0;

    startX = e.clientX;
    startY = e.clientY;
});

window.addEventListener("mousemove", e => {
    if(!isDragging) return;

    let dx = e.clientX - startX;
    let dy = e.clientY - startY;

    posX += dx;
    posY += dy;

    velocityX = dx;
    velocityY = dy;

    startX = e.clientX;
    startY = e.clientY;

    clampPosition();
    updateTransform();
});

window.addEventListener("mouseup", () => {
    if(isDragging){
        isDragging = false;
        inertia();
    }
});

/* ===== 手機 ===== */

viewer.addEventListener("touchstart", e => {

    if(e.touches.length === 1){
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isMoved = false;
    }

});

/* ===== 手機移動 / 縮放 ===== */

viewer.addEventListener("touchmove", function(e){

    if(e.touches.length === 2){

        e.preventDefault();

        let dx = e.touches[0].clientX - e.touches[1].clientX;
        let dy = e.touches[0].clientY - e.touches[1].clientY;

        let distance = Math.sqrt(dx*dx + dy*dy);

        if(!initialDistance){
            initialDistance = distance;
        }

        let scaleChange = distance / initialDistance;
        scale = Math.min(Math.max(1, scale * scaleChange), 4);

        initialDistance = distance;

        clampPosition();
        updateTransform();
    }

    if(e.touches.length === 1 && scale > 1){

        e.preventDefault();

        let touch = e.touches[0];

        let dx = touch.clientX - startX;
        let dy = touch.clientY - startY;

        if(Math.abs(dx) > 5 || Math.abs(dy) > 5){
            isMoved = true;
        }

        posX += dx;
        posY += dy;

        velocityX = dx;
        velocityY = dy;

        startX = touch.clientX;
        startY = touch.clientY;

        clampPosition();
        updateTransform();
    }

}, { passive:false });

/* ===== 手機結束 ===== */

viewer.addEventListener("touchend", function(e){

    initialDistance = null;

    if(!isMoved){

        const touch = e.changedTouches[0];
        const x = touch.clientX;
        const width = window.innerWidth;

        const target = document.elementFromPoint(x, touch.clientY);

        if(target === bigImage) return;
        if(target.id === "prev" || target.id === "next" || target.id === "close") return;

        if(x < width / 2){
            currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
        }else{
            currentIndex = (currentIndex + 1) % currentGallery.length;
        }

        showImage();

    }else{
        inertia();
    }

});

</script>

</body>
</html>
