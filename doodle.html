<!DOCTYPE html>
<html lang="zh">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    
<meta charset="UTF-8">
<title>Doodle</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="page">

<h1>插圖 DOODLE</h1>

<p>
角色塗鴉＆小漫畫。
</p>

<h2>插圖</h2>

<div class="gallery">
    <img src="img/members.jpg">
    <img src="img/sh.jpg">
</div>

<h2>漫畫</h2>

<div class="gallery">
    <img src="img/humor.jpg">
    <img src="img/s3x.jpg">
    <img src="img/cure.jpg">
    <img src="img/speachless.jpg">
</div>

<a class="back" href="index.html">← 回到首頁</a>

</div>


<!-- 圖片放大查看器 -->
<div id="viewer">
    
    <div id="close">✕</div>
    
    <div id="prev">‹</div>

    <img id="bigImage">

    <div id="next">›</div>

    <div id="counter">1 / 1</div>

</div>


<script>

const closeBtn = document.getElementById("close");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const counter = document.getElementById("counter");

const galleries = document.querySelectorAll(".gallery");
const viewer = document.getElementById("viewer");
const bigImage = document.getElementById("bigImage");

let currentIndex = 0;
let currentGallery = [];

/* ⭐ 縮放 + 拖曳參數 */
let scale = 1;
let posX = 0;
let posY = 0;

let isDragging = false;
let startX = 0;
let startY = 0;

/* ⭐ 統一 transform */
function updateTransform(){
    bigImage.style.transform =
        "translate(" + posX + "px," + posY + "px) scale(" + scale + ")";
}

/* 點圖片 */
galleries.forEach(gallery => {

    const imgs = gallery.querySelectorAll("img");

    imgs.forEach((img, index) => {

        img.onclick = function(){

            currentGallery = imgs;
            currentIndex = index;

            showImage();
            viewer.style.display = "flex";

            document.body.style.overflow = "hidden";
        }

    });

});

/* 顯示圖片 */
function showImage(){
    bigImage.src = currentGallery[currentIndex].src;

    scale = 1;
    posX = 0;
    posY = 0;

    updateTransform();

    counter.innerText = (currentIndex + 1) + " / " + currentGallery.length;
}

/* 點背景 / 切換 */
viewer.addEventListener("click", function(e){

    if(e.target === bigImage) return;

    if(e.target.id === "prev" || e.target.id === "next" || e.target.id === "close") return;

    if(e.target === viewer){
        viewer.style.display = "none";
        document.body.style.overflow = "";
        return;
    }

    const x = e.clientX;
    const width = window.innerWidth;

    if(x < width / 2){
        currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
    }else{
        currentIndex = (currentIndex + 1) % currentGallery.length;
    }

    showImage();
});

/* 關閉 */
closeBtn.onclick = function(e){
    e.stopPropagation();
    viewer.style.display = "none";
    document.body.style.overflow = "";
}

/* 左右按鈕 */
prev.onclick = function(e){
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
    showImage();
}

next.onclick = function(e){
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % currentGallery.length;
    showImage();
}

/* 鍵盤 */
document.addEventListener("keydown", function(e){

    if(viewer.style.display !== "flex") return;

    if(e.key === "ArrowLeft"){
        currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
        showImage();
    }

    if(e.key === "ArrowRight"){
        currentIndex = (currentIndex + 1) % currentGallery.length;
        showImage();
    }

});

/* 滾輪縮放（電腦） */
bigImage.addEventListener("wheel", function(e){
    e.preventDefault();

    if(e.deltaY < 0){
        scale += 0.1;
    }else{
        scale -= 0.1;
    }

    scale = Math.min(Math.max(1, scale), 3);

    updateTransform();
});

/* 滑鼠拖曳 */
bigImage.addEventListener("mousedown", e => {
    if(scale <= 1) return;

    isDragging = true;
    startX = e.clientX - posX;
    startY = e.clientY - posY;
});

window.addEventListener("mousemove", e => {
    if(!isDragging) return;

    posX = e.clientX - startX;
    posY = e.clientY - startY;

    updateTransform();
});

window.addEventListener("mouseup", () => {
    isDragging = false;
});

/* 手機觸控 */
let initialDistance = null;

viewer.addEventListener("touchstart", e => {
    if(e.touches.length === 1){
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    }
});

viewer.addEventListener("touchmove", function(e){

    if(e.touches.length === 2){
        e.preventDefault();

        let dx = e.touches[0].clientX - e.touches[1].clientX;
        let dy = e.touches[0].clientY - e.touches[1].clientY;

        let distance = Math.sqrt(dx*dx + dy*dy);

        if(!initialDistance){
            initialDistance = distance;
        }

        let scaleChange = distance / initialDistance;

        scale = Math.min(Math.max(1, scale * scaleChange), 3);

        updateTransform();
    }

    if(e.touches.length === 1 && scale > 1){
        e.preventDefault();

        let touch = e.touches[0];

        posX += touch.clientX - startX;
        posY += touch.clientY - startY;

        startX = touch.clientX;
        startY = touch.clientY;

        updateTransform();
    }

}, { passive:false });

viewer.addEventListener("touchend", function(){
    initialDistance = null;
});

</script>

</body>
</html>
