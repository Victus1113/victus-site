<!DOCTYPE html>
<html lang="zh">

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta charset="UTF-8">
<title>Doodle</title>
<link rel="stylesheet" href="style.css">

<style>

/* ===== Viewer 改回全螢幕 ===== */
#viewer{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,0.95);

    display:none;
    align-items:center;
    justify-content:center;

    z-index:9999;
}

/* 圖片完整顯示 */
#viewer img{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;

    transition:0.3s;
}

/* ===== 箭頭 ===== */
#prev, #next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);

    font-size:40px;
    color:white;

    padding:20px;
    cursor:pointer;

    opacity:0.6;
    z-index:10;
}

/* ⭐ 關鍵：確保一定在畫面內 */
#prev{ left:5vw; }
#next{ right:5vw; }

#prev:hover, #next:hover{
    opacity:1;
}

/* ===== 關閉 ===== */
#close{
    position:absolute;
    top:20px;
    right:20px;

    font-size:28px;
    color:white;

    cursor:pointer;
}

/* ===== 頁數 ===== */
#counter{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);

    color:#ccc;
}

/* ===== 手機優化 ===== */
@media (max-width:768px){

#viewer img{
    max-width:100%;
    max-height:75vh;
}

/* 箭頭縮小但一定可見 */
#prev, #next{
    font-size:30px;
    padding:10px;
}

#prev{ left:10px; }
#next{ right:10px; }

}

</style>
</head>

<body>

<div class="page">

<h1>插圖 DOODLE</h1>
<p>角色塗鴉＆小漫畫。</p>

<h2>插圖</h2>
<div class="gallery">
    <img src="img/members.jpg">
    <img src="img/sh.jpg">
</div>

<h2>漫畫</h2>
<div class="gallery">
    <img src="img/humor.jpg">
    <img src="img/s3x.jpg">
    <img src="img/cure.jpg">
    <img src="img/speachless.jpg">
</div>

<a class="back" href="index.html">← 回到首頁</a>

</div>

<!-- Viewer -->
<div id="viewer">

    <div id="close">✕</div>

    <div id="prev">‹</div>

    <img id="bigImage">

    <div id="next">›</div>

    <div id="counter">1 / 1</div>

</div>

<script>

const viewer = document.getElementById("viewer");
const bigImage = document.getElementById("bigImage");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const closeBtn = document.getElementById("close");
const counter = document.getElementById("counter");

const galleries = document.querySelectorAll(".gallery");

let currentIndex = 0;
let currentGallery = [];

/* 點圖片 */
galleries.forEach(gallery=>{
    const imgs = gallery.querySelectorAll("img");

    imgs.forEach((img,index)=>{
        img.onclick = ()=>{
            currentGallery = imgs;
            currentIndex = index;
            showImage();
            viewer.style.display = "flex";
            document.body.style.overflow="hidden";
        }
    });
});

/* 顯示圖片 */
function showImage(){
    bigImage.src = currentGallery[currentIndex].src;
    counter.innerText = (currentIndex+1)+" / "+currentGallery.length;
}

/* 關閉 */
function closeViewer(){
    viewer.style.display="none";
    document.body.style.overflow="";
}

closeBtn.onclick = e=>{
    e.stopPropagation();
    closeViewer();
};

/* 左右 */
prev.onclick = e=>{
    e.stopPropagation();
    currentIndex = (currentIndex-1+currentGallery.length)%currentGallery.length;
    showImage();
};

next.onclick = e=>{
    e.stopPropagation();
    currentIndex = (currentIndex+1)%currentGallery.length;
    showImage();
};

/* 點背景關閉 */
viewer.addEventListener("click", e=>{
    if(e.target===bigImage || e.target.id==="prev" || e.target.id==="next" || e.target.id==="close") return;
    closeViewer();
});

/* 鍵盤 */
document.addEventListener("keydown", e=>{
    if(viewer.style.display!=="flex") return;

    if(e.key==="ArrowLeft") prev.click();
    if(e.key==="ArrowRight") next.click();
});

/* 手機滑動 */
let startX = 0;

viewer.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
});

viewer.addEventListener("touchend", e=>{
    let endX = e.changedTouches[0].clientX;

    if(endX - startX > 50){
        prev.click();
    }

    if(startX - endX > 50){
        next.click();
    }
});

</script>

</body>
</html>
