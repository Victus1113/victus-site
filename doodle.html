<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">
<title>Doodle</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="page">

<h1>插圖 DOODLE</h1>

<p>
角色塗鴉＆小漫畫。
</p>

<h2>插圖</h2>

<div class="gallery">
    <img src="img/members.jpg">
    <img src="img/sh.jpg">
</div>

<h2>漫畫</h2>

<div class="gallery">
    <img src="img/humor.jpg">
    <img src="img/s3x.jpg">
    <img src="img/cure.jpg">
    <img src="img/speachless.jpg">
</div>

<a class="back" href="index.html">← 回到首頁</a>

</div>


<!-- 圖片放大查看器 -->
<div id="viewer">

    <div id="prev">‹</div>

    <img id="bigImage">

    <div id="next">›</div>

    <div id="counter">1 / 1</div>

</div>


<script>

const prev = document.getElementById("prev");
const next = document.getElementById("next");
const counter = document.getElementById("counter");
    
const galleries = document.querySelectorAll(".gallery");
const viewer = document.getElementById("viewer");
const bigImage = document.getElementById("bigImage");

let currentIndex = 0;
let currentGallery = [];

/* 點圖片 */
galleries.forEach(gallery => {

    const imgs = gallery.querySelectorAll("img");

    imgs.forEach((img, index) => {

        img.onclick = function(){

            currentGallery = imgs;   // ⭐ 記住是哪一區
            currentIndex = index;

            showImage();
            viewer.style.display = "flex";
        }

    });

});

/* 顯示圖片 */
function showImage(){
    bigImage.src = currentGallery[currentIndex].src;

    // ⭐ 更新頁數
    counter.innerText = (currentIndex + 1) + " / " + currentGallery.length;
}

viewer.addEventListener("click", function(e){

    // 點圖片 → 不動
    if(e.target === bigImage) return;

    // 點背景 → 判斷左右
    const x = e.clientX;
    const width = window.innerWidth;

    // 點很中間 → 關閉（避免誤觸）
    if(Math.abs(x - width/2) < 50){
        viewer.style.display = "none";
        return;
    }

    if(x < width / 2){
        currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
    }else{
        currentIndex = (currentIndex + 1) % currentGallery.length;
    }

    showImage();
});



/* 👉 手機滑動 */
let startX = 0;

viewer.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

viewer.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;

    if(endX - startX > 50){
        currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
        showImage();
    }

    if(startX - endX > 50){
        currentIndex = (currentIndex + 1) % currentGallery.length;
        showImage();
    }
});

/* 左右按鈕 */

prev.onclick = function(e){
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
    showImage();
}

next.onclick = function(e){
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % currentGallery.length;
    showImage();
}

document.addEventListener("keydown", function(e){

    if(viewer.style.display !== "flex") return;

    if(e.key === "ArrowLeft"){
        currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
        showImage();
    }

    if(e.key === "ArrowRight"){
        currentIndex = (currentIndex + 1) % currentGallery.length;
        showImage();
    }

});
    
</script>

</body>
</html>
