<style>

/* ===== Viewer 改回全螢幕 ===== */
#viewer{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,0.95);

    display:none;
    align-items:center;
    justify-content:center;

    z-index:9999;
}

/* 圖片完整顯示 */
#viewer img{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;

    transition:0.3s;
}

/* ===== 箭頭 ===== */
#prev, #next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);

    font-size:40px;
    color:white;

    padding:20px;
    cursor:pointer;

    opacity:0.6;
    z-index:10;
}

/* ⭐ 關鍵：確保一定在畫面內 */
#prev{ left:5vw; }
#next{ right:5vw; }

#prev:hover, #next:hover{
    opacity:1;
}

/* ===== 關閉 ===== */
#close{
    position:absolute;
    top:20px;
    right:20px;

    font-size:28px;
    color:white;

    cursor:pointer;
}

/* ===== 頁數 ===== */
#counter{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#ccc;
}

/* ===== 圖片名稱／註解 ===== */
#caption{
    position:absolute;
    bottom:20px;
    left:5vw;
    color:#fff;
    font-size:19px;
    letter-spacing:0.5px;
    z-index:10;
}

/* ===== 手機 ===== */
@media (max-width:768px){

    #caption{
        left:50%;
        transform:translateX(-50%);
        bottom:50px;
        white-space:nowrap;
        text-align:center;
    }

    #counter{
        bottom:20px;
        left:50%;
        transform:translateX(-50%);
    }
}

/* ===== 手機優化 ===== */
@media (max-width:768px){

#viewer img{
    max-width:100%;
    max-height:75vh;
}

/* 箭頭縮小但一定可見 */
#prev, #next{
    font-size:30px;
    padding:10px;
}

#prev{ left:10px; }
#next{ right:10px; }

}

<!-- Viewer -->
<div id="viewer">

    <div id="close">✕</div>

    <div id="prev">‹</div>

    <img id="bigImage">

    <div id="next">›</div>

    <div id="caption"></div>
    <div id="counter">1 / 1</div>

</div>

<script>

const viewer = document.getElementById("viewer");
const bigImage = document.getElementById("bigImage");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const closeBtn = document.getElementById("close");
const counter = document.getElementById("counter");
const caption = document.getElementById("caption");

const galleries = document.querySelectorAll(".gallery");

//手機縮放//
let baseScale = 1;       // ⭐ 真正縮放基準
let pinchStartScale = 1; // ⭐ 手勢開始時的 scale

let currentIndex = 0;
let currentGallery = [];

let blockClick = false;
let previewPrev = new Image();
let previewNext = new Image();

/* ===== 狀態 ===== */
let scale = 1;
let posX = 0;
let posY = 0;

let isDragging = false;
let startX = 0;
let startY = 0;

let initialDistance = null;
let touchStartX = 0;

let isSwiping = false;

/* ===== 更新 ===== */
function updateTransform(){
    bigImage.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
}

/* ===== 邊界 ===== */
function clamp(){

    const rect = bigImage.getBoundingClientRect();

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const maxX = Math.max(
        0,
        (rect.width - vw) / 2
    );

    const maxY = Math.max(
        0,
        (rect.height - vh) / 2
    );

    posX = Math.min(
        maxX,
        Math.max(-maxX, posX)
    );

    posY = Math.min(
        maxY,
        Math.max(-maxY, posY)
    );
}

/* ===== 切圖 ===== */
function goPrev(){
    currentIndex = (currentIndex-1+currentGallery.length)%currentGallery.length;
    showImage();
}
function goNext(){
    currentIndex = (currentIndex+1)%currentGallery.length;
    showImage();
}

/* ===== 開啟 ===== */
galleries.forEach(gallery=>{
    const imgs = gallery.querySelectorAll("img");

    imgs.forEach((img,index)=>{
        img.onclick = (e)=>{

            if(blockClick) return; // ⭐ 防止穿透

            currentGallery = imgs;
            currentIndex = index;

            showImage();
            viewer.style.display="flex";
            document.body.style.overflow="hidden";
        }
    });
});

/* ===== 顯示 ===== */
function showImage(){

    bigImage.style.transition = "none"; // ⭐ 先關掉

    bigImage.src = currentGallery[currentIndex].src;

    const prevIndex = (currentIndex-1+currentGallery.length)%currentGallery.length;
    const nextIndex = (currentIndex+1)%currentGallery.length;

    previewPrev.src = currentGallery[prevIndex].src;
    previewNext.src = currentGallery[nextIndex].src;

    scale = 1;
    posX = 0;
    posY = 0;

    viewer.style.backgroundImage = "";
    bigImage.style.opacity = 1;

    updateTransform();
    // ⭐ 下一幀再開動畫
    requestAnimationFrame(()=>{
        bigImage.style.transition = "transform 0.2s ease";
    });

    counter.innerText = (currentIndex+1)+" / "+currentGallery.length;
    caption.innerText = currentGallery[currentIndex].dataset.caption || "";
}

/* ===== 關閉手機的圖片 ===== */
function closeViewer(){

    blockClick = true; // ⭐ 關鍵：開始擋 click

    viewer.style.display="none";
    document.body.style.overflow="";
    viewer.style.backgroundImage = "";

    /* ⭐ 300ms 後恢復 */
    setTimeout(()=>{
        blockClick = false;
    }, 300);
}

/* ===== 關閉按鈕 ===== */
closeBtn.onclick = e=>{
    e.stopPropagation();
    closeViewer();
};

/* ===== 電腦箭頭 ===== */
prev.onclick = e=>{
    e.stopPropagation();
    if(scale === 1) goPrev();
};

next.onclick = e=>{
    e.stopPropagation();
    if(scale === 1) goNext();
};

/* ===== 鍵盤（修好） ===== */
document.addEventListener("keydown", e=>{
    if(viewer.style.display !== "flex") return;
    if(scale > 1) return;

    if(e.key === "ArrowLeft") goPrev();
    if(e.key === "ArrowRight") goNext();
});

/* ===== 滾輪縮放 ===== */
bigImage.addEventListener("wheel", e=>{
    e.preventDefault();

    let oldScale = scale;
    scale += e.deltaY<0?0.15:-0.15;
    scale = Math.min(Math.max(1,scale),4);

    const rect = bigImage.getBoundingClientRect();
    const ratio = scale/oldScale;

    posX -= (e.clientX-rect.left-rect.width/2)*(ratio-1);
    posY -= (e.clientY-rect.top-rect.height/2)*(ratio-1);

    clamp();
    updateTransform();
});

/* ===== 滑鼠拖曳 ===== */
bigImage.addEventListener("mousedown", e=>{
    if(scale<=1) return;
    isDragging=true;
    startX=e.clientX;
    startY=e.clientY;
});

window.addEventListener("mousemove", e=>{
    if(!isDragging) return;

    let dx=e.clientX-startX;
    let dy=e.clientY-startY;

    posX+=dx;
    posY+=dy;

    startX=e.clientX;
    startY=e.clientY;

    clamp();
    updateTransform();
});

window.addEventListener("mouseup", ()=>{
    isDragging=false;
});

/* ===== 手機觸控：雙指縮放 + 放大拖曳 + 滑頁 + 雙擊 ===== */

let isTap = false;
let lastTapTime = 0;

let pinchStartDistance = 0;
let pinchStartScale = 1;

let pinchCenterStartX = 0;
let pinchCenterStartY = 0;

let lastTouchX = 0;
let lastTouchY = 0;


/* ===== 計算雙指距離 ===== */
function getTouchDistance(t1, t2){
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;

    return Math.sqrt(dx * dx + dy * dy);
}


/* ===== 計算雙指中心 ===== */
function getTouchCenter(t1, t2){
    return {
        x: (t1.clientX + t2.clientX) / 2,
        y: (t1.clientY + t2.clientY) / 2
    };
}


/* ===== Touch Start ===== */
bigImage.addEventListener("touchstart", e=>{

    /* ===== 雙指：開始 Pinch ===== */
    if(e.touches.length === 2){

        e.preventDefault();

        const t1 = e.touches[0];
        const t2 = e.touches[1];

        pinchStartDistance = getTouchDistance(t1, t2);
        pinchStartScale = scale;

        const center = getTouchCenter(t1, t2);

        pinchCenterStartX = center.x;
        pinchCenterStartY = center.y;

        isTap = false;
        isSwiping = false;

        return;
    }


    /* ===== 單指 ===== */
    if(e.touches.length === 1){

        const t = e.touches[0];

        startX = t.clientX;
        startY = t.clientY;

        lastTouchX = t.clientX;
        lastTouchY = t.clientY;

        touchStartX = t.clientX;

        isSwiping = false;
        isTap = true;
    }

}, {passive:false});


/* ===== Touch Move ===== */
bigImage.addEventListener("touchmove", e=>{

    /* =================================================
       雙指縮放
    ================================================= */

    if(e.touches.length === 2){

        e.preventDefault();

        const t1 = e.touches[0];
        const t2 = e.touches[1];

        const distance = getTouchDistance(t1, t2);

        if(!pinchStartDistance) return;

        const scaleFactor =
            distance / pinchStartDistance;

        let newScale =
            pinchStartScale * scaleFactor;

        newScale =
            Math.min(
                Math.max(1, newScale),
                4
            );


        /* ===== 雙指中心 ===== */

        const center =
            getTouchCenter(t1, t2);


        /*
         * 讓縮放以雙指中心為基準
         */

        const rect =
            bigImage.getBoundingClientRect();


        const imageCenterX =
            rect.left + rect.width / 2;

        const imageCenterY =
            rect.top + rect.height / 2;


        const offsetX =
            center.x - imageCenterX;

        const offsetY =
            center.y - imageCenterY;


        const scaleRatio =
            newScale / scale;


        posX -=
            offsetX * (scaleRatio - 1);

        posY -=
            offsetY * (scaleRatio - 1);


        scale = newScale;

        clamp();
        updateTransform();

        isTap = false;

        return;
    }


    /* =================================================
       單指
    ================================================= */

    if(e.touches.length === 1){

        const t = e.touches[0];

        const dx =
            t.clientX - touchStartX;


        /* =============================================
           放大後：單指拖曳
        ============================================= */

        if(scale > 1){

            e.preventDefault();

            const moveX =
                t.clientX - lastTouchX;

            const moveY =
                t.clientY - lastTouchY;


            posX += moveX;
            posY += moveY;


            lastTouchX = t.clientX;
            lastTouchY = t.clientY;


            clamp();
            updateTransform();

            isTap = false;

            return;
        }


        /* =============================================
           1x：左右滑頁
        ============================================= */

        if(Math.abs(dx) > 30){

            isSwiping = true;
            isTap = false;

            e.preventDefault();

            posX = dx;

            bigImage.style.transform =
                `translate(${dx}px, 0) scale(1)`;

            bigImage.style.opacity =
                1 -
                Math.min(
                    Math.abs(dx) / 300,
                    0.5
                );
        }

    }

}, {passive:false});


/* ===== Touch End ===== */
bigImage.addEventListener("touchend", e=>{

    const now = Date.now();

    const changedTouch =
        e.changedTouches[0];

    const dx =
        changedTouch.clientX -
        touchStartX;


    /* =================================================
       雙擊
    ================================================= */

    if(now - lastTapTime < 250){

        e.preventDefault();

        if(scale === 1){

            scale = 2;

        }else{

            scale = 1;
            posX = 0;
            posY = 0;

        }

        clamp();
        updateTransform();

        lastTapTime = 0;
        isTap = false;

        return;
    }


    lastTapTime = now;


    /* =================================================
       點擊背景關閉
    ================================================= */

    if(
        scale === 1 &&
        isTap
    ){

        if(e.target === viewer){

            closeViewer();

        }

        return;
    }


    /* =================================================
       左右滑頁
    ================================================= */

    if(
        scale === 1 &&
        isSwiping
    ){

        if(dx > 80){

            goPrev();

        }else if(dx < -80){

            goNext();

        }else{

            posX = 0;

            bigImage.style.opacity = 1;

            updateTransform();

        }

        return;
    }


    /* =================================================
       放大狀態結束
       不重設 posX / posY
    ================================================= */

    if(scale > 1){

        clamp();
        updateTransform();

    }

});


/* ===== 第二根手指離開後，避免座標跳動 ===== */

bigImage.addEventListener("touchend", e=>{

    if(e.touches.length === 1){

        const t = e.touches[0];

        lastTouchX = t.clientX;
        lastTouchY = t.clientY;

        startX = t.clientX;
        startY = t.clientY;

    }

});

/* ===== 點背景關閉（桌機） ===== */
viewer.addEventListener("click", e=>{

    if(
        e.target === bigImage ||
        e.target.id === "prev" ||
        e.target.id === "next" ||
        e.target.id === "close"
    ) return;

    closeViewer();

});

</script>
