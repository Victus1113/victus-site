<style>

/* =========================================================
   Viewer 全螢幕
========================================================= */

#viewer{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.95);

    display:none;

    align-items:center;
    justify-content:center;

    box-sizing:border-box;

    padding:50px 20px 80px;

    z-index:9999;
}


/* =========================================================
   圖片區
========================================================= */

#image-box{

    display:inline-flex;

    flex-direction:column;

    align-items:stretch;

    justify-content:center;

    max-width:calc(100vw - 40px);

}


/* =========================================================
   大圖
========================================================= */

#viewer img{

    display:block;

    max-width:calc(100vw - 40px);

    max-height:calc(100vh - 150px);

    width:auto;
    height:auto;

    object-fit:contain;

    transition:transform 0.2s ease;

    user-select:none;

    -webkit-user-drag:none;
}


/* =========================================================
   圖片下方資訊
   左：名稱
   右：頁碼
========================================================= */

#viewer-info{

    width:100%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-sizing:border-box;

    padding-top:8px;

    gap:20px;
}


/* ===== 圖片名稱 ===== */

#caption{

    color:#fff;

    font-size:19px;

    letter-spacing:0.5px;

    background:rgba(0,0,0,0.65);

    padding:4px 10px;

    box-sizing:border-box;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    text-align:left;

    min-width:0;
}


/* ===== 頁碼 ===== */

#counter{

    color:#ccc;

    font-size:16px;

    letter-spacing:1px;

    background:rgba(0,0,0,0.65);

    padding:4px 10px;

    box-sizing:border-box;

    white-space:nowrap;

    text-align:right;
}


/* =========================================================
   左右箭頭
========================================================= */

#prev,
#next{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    font-size:72px;

    line-height:1;

    color:white;

    padding:20px 28px;

    cursor:pointer;

    opacity:0.7;

    z-index:10;

    user-select:none;

    -webkit-tap-highlight-color:transparent;

}


#prev:hover,
#next:hover{

    opacity:1;

}


/* ===== 箭頭位置 ===== */

#prev{
    left:3vw;
}

#next{
    right:3vw;
}


/* =========================================================
   關閉
========================================================= */

#close{

    position:absolute;

    top:20px;
    right:20px;

    font-size:28px;

    color:white;

    cursor:pointer;

    z-index:20;

    user-select:none;

}


/* =========================================================
   手機
========================================================= */

@media (max-width:768px){

    #viewer{

        padding:45px 15px 70px;

    }


    #image-box{

        max-width:calc(100vw - 30px);

    }


    #viewer img{

        max-width:calc(100vw - 30px);

        max-height:calc(75vh - 20px);

    }


    /* ===== 下方資訊 ===== */

    #viewer-info{

        padding-top:7px;

        gap:10px;

    }


    #caption{

        font-size:16px;

        padding:3px 8px;

        max-width:70%;

    }


    #counter{

        font-size:14px;

        padding:3px 8px;

    }


    /* ===== 手機箭頭 ===== */

    #prev,
    #next{

        font-size:60px;

        padding:15px 18px;

    }


    #prev{
        left:0;
    }

    #next{
        right:0;
    }


    /* ===== 關閉 ===== */

    #close{

        top:15px;
        right:15px;

        font-size:26px;

    }

}

</style>

</head>

<!-- =========================================================
     Viewer
========================================================= -->

<div id="viewer">

    <div id="close">✕</div>

    <div id="prev">‹</div>


    <!-- 圖片＋下方資訊 -->

    <div id="image-box">

        <img id="bigImage">

        <div id="viewer-info">

            <div id="caption"></div>

            <div id="counter">1 / 1</div>

        </div>

    </div>


    <div id="next">›</div>

</div>


<script>


/* =========================================================
   DOM
========================================================= */

const viewer =
    document.getElementById("viewer");

const bigImage =
    document.getElementById("bigImage");

const prev =
    document.getElementById("prev");

const next =
    document.getElementById("next");

const closeBtn =
    document.getElementById("close");

const counter =
    document.getElementById("counter");

const caption =
    document.getElementById("caption");

const galleries =
    document.querySelectorAll(".gallery");


/* =========================================================
   狀態
========================================================= */

let currentIndex = 0;

let currentGallery = [];

let blockClick = false;


/* ===== 縮放 ===== */

let scale = 1;

let posX = 0;

let posY = 0;


/* ===== 滑鼠 ===== */

let isDragging = false;

let startX = 0;

let startY = 0;


/* ===== Touch ===== */

let initialDistance = null;

let touchStartX = 0;

let isSwiping = false;

let isTap = false;

let lastTapTime = 0;


/* ===== Pinch ===== */

let pinchStartDistance = 0;

let pinchStartScale = 1;


/* ===== Touch 拖曳 ===== */

let lastTouchX = 0;

let lastTouchY = 0;


/* ===== 預載下一張 ===== */

let previewPrev = new Image();

let previewNext = new Image();


/* =========================================================
   更新圖片位置
========================================================= */

function updateTransform(){

    bigImage.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;

}


/* =========================================================
   邊界
========================================================= */

function clamp(){

    const rect =
        bigImage.getBoundingClientRect();


    const vw =
        window.innerWidth;

    const vh =
        window.innerHeight;


    const maxX =
        Math.max(
            0,
            (rect.width - vw) / 2
        );


    const maxY =
        Math.max(
            0,
            (rect.height - vh) / 2
        );


    posX =
        Math.min(
            maxX,
            Math.max(-maxX, posX)
        );


    posY =
        Math.min(
            maxY,
            Math.max(-maxY, posY)
        );

}


/* =========================================================
   上一張
========================================================= */

function goPrev(){

    currentIndex =
        (currentIndex - 1 + currentGallery.length)
        % currentGallery.length;

    showImage();

}


/* =========================================================
   下一張
========================================================= */

function goNext(){

    currentIndex =
        (currentIndex + 1)
        % currentGallery.length;

    showImage();

}


/* =========================================================
   開啟圖片
========================================================= */

galleries.forEach(gallery=>{

    const imgs =
        gallery.querySelectorAll("img");


    imgs.forEach((img,index)=>{

        img.onclick = (e)=>{

            if(blockClick) return;


            currentGallery =
                imgs;

            currentIndex =
                index;


            showImage();


            viewer.style.display =
                "flex";


            document.body.style.overflow =
                "hidden";

        };

    });

});


/* =========================================================
   顯示圖片
========================================================= */

function showImage(){

    bigImage.style.transition =
        "none";


    bigImage.src =
        currentGallery[currentIndex].src;


    /* ===== 預載前後圖片 ===== */

    const prevIndex =
        (currentIndex - 1 + currentGallery.length)
        % currentGallery.length;


    const nextIndex =
        (currentIndex + 1)
        % currentGallery.length;


    previewPrev.src =
        currentGallery[prevIndex].src;


    previewNext.src =
        currentGallery[nextIndex].src;


    /* ===== 重設縮放 ===== */

    scale = 1;

    posX = 0;

    posY = 0;


    bigImage.style.opacity = 1;


    updateTransform();


    /* ===== 更新文字 ===== */

    counter.innerText =
        (currentIndex + 1)
        + " / "
        + currentGallery.length;


    caption.innerText =
        currentGallery[currentIndex]
        .dataset.caption || "";


    /* ===== 下一幀恢復動畫 ===== */

    requestAnimationFrame(()=>{

        bigImage.style.transition =
            "transform 0.2s ease";

    });

}


/* =========================================================
   關閉 Viewer
========================================================= */

function closeViewer(){

    blockClick = true;


    viewer.style.display =
        "none";


    document.body.style.overflow =
        "";


    viewer.style.backgroundImage =
        "";


    setTimeout(()=>{

        blockClick = false;

    },300);

}


/* =========================================================
   關閉按鈕
========================================================= */

closeBtn.onclick = e=>{

    e.stopPropagation();

    closeViewer();

};


/* =========================================================
   桌機箭頭
========================================================= */

prev.onclick = e=>{

    e.stopPropagation();


    if(scale === 1){

        goPrev();

    }

};


next.onclick = e=>{

    e.stopPropagation();


    if(scale === 1){

        goNext();

    }

};


/* =========================================================
   鍵盤
========================================================= */

document.addEventListener("keydown",e=>{

    if(viewer.style.display !== "flex")
        return;


    if(scale > 1)
        return;


    if(e.key === "ArrowLeft")
        goPrev();


    if(e.key === "ArrowRight")
        goNext();


    if(e.key === "Escape")
        closeViewer();

});


/* =========================================================
   滾輪縮放
========================================================= */

bigImage.addEventListener("wheel",e=>{

    e.preventDefault();


    const oldScale =
        scale;


    scale +=
        e.deltaY < 0
        ? 0.15
        : -0.15;


    scale =
        Math.min(
            Math.max(1,scale),
            4
        );


    const rect =
        bigImage.getBoundingClientRect();


    const ratio =
        scale / oldScale;


    posX -=
        (
            e.clientX
            - rect.left
            - rect.width / 2
        )
        * (ratio - 1);


    posY -=
        (
            e.clientY
            - rect.top
            - rect.height / 2
        )
        * (ratio - 1);


    clamp();

    updateTransform();

});


/* =========================================================
   滑鼠拖曳
========================================================= */

bigImage.addEventListener("mousedown",e=>{

    if(scale <= 1)
        return;


    isDragging = true;


    startX =
        e.clientX;

    startY =
        e.clientY;

});


window.addEventListener("mousemove",e=>{

    if(!isDragging)
        return;


    const dx =
        e.clientX - startX;


    const dy =
        e.clientY - startY;


    posX += dx;

    posY += dy;


    startX =
        e.clientX;

    startY =
        e.clientY;


    clamp();

    updateTransform();

});


window.addEventListener("mouseup",()=>{

    isDragging = false;

});


/* =========================================================
   Touch：計算雙指距離
========================================================= */

function getTouchDistance(t1,t2){

    const dx =
        t1.clientX - t2.clientX;


    const dy =
        t1.clientY - t2.clientY;


    return Math.sqrt(
        dx * dx + dy * dy
    );

}


/* =========================================================
   Touch Start
========================================================= */

bigImage.addEventListener(
    "touchstart",
    e=>{


        /* ===== 雙指 ===== */

        if(e.touches.length === 2){

            e.preventDefault();


            const t1 =
                e.touches[0];

            const t2 =
                e.touches[1];


            pinchStartDistance =
                getTouchDistance(t1,t2);


            pinchStartScale =
                scale;


            isTap = false;

            isSwiping = false;


            return;

        }


        /* ===== 單指 ===== */

        if(e.touches.length === 1){

            const t =
                e.touches[0];


            startX =
                t.clientX;

            startY =
                t.clientY;


            lastTouchX =
                t.clientX;

            lastTouchY =
                t.clientY;


            touchStartX =
                t.clientX;


            isSwiping = false;

            isTap = true;

        }

    },
    {passive:false}
);


/* =========================================================
   Touch Move
========================================================= */

bigImage.addEventListener(
    "touchmove",
    e=>{


        /* =================================================
           雙指縮放
        ================================================= */

        if(e.touches.length === 2){

            e.preventDefault();


            const t1 =
                e.touches[0];

            const t2 =
                e.touches[1];


            const distance =
                getTouchDistance(t1,t2);


            if(!pinchStartDistance)
                return;


            const scaleFactor =
                distance / pinchStartDistance;


            let newScale =
                pinchStartScale * scaleFactor;


            newScale =
                Math.min(
                    Math.max(1,newScale),
                    4
                );


            const rect =
                bigImage.getBoundingClientRect();


            const imageCenterX =
                rect.left + rect.width / 2;


            const imageCenterY =
                rect.top + rect.height / 2;


            const centerX =
                (t1.clientX + t2.clientX) / 2;


            const centerY =
                (t1.clientY + t2.clientY) / 2;


            const offsetX =
                centerX - imageCenterX;


            const offsetY =
                centerY - imageCenterY;


            const scaleRatio =
                newScale / scale;


            posX -=
                offsetX * (scaleRatio - 1);


            posY -=
                offsetY * (scaleRatio - 1);


            scale =
                newScale;


            clamp();

            updateTransform();


            isTap = false;

            isSwiping = false;


            return;

        }


        /* =================================================
           單指
        ================================================= */

        if(e.touches.length === 1){

            const t =
                e.touches[0];


            const dx =
                t.clientX - touchStartX;


            /* ===== 放大後拖曳 ===== */

            if(scale > 1){

                e.preventDefault();


                const moveX =
                    t.clientX - lastTouchX;


                const moveY =
                    t.clientY - lastTouchY;


                posX += moveX;

                posY += moveY;


                lastTouchX =
                    t.clientX;

                lastTouchY =
                    t.clientY;


                clamp();

                updateTransform();


                isTap = false;

                return;

            }


            /* ===== 1x 滑頁 ===== */

            if(Math.abs(dx) > 30){

                isSwiping = true;

                isTap = false;


                e.preventDefault();


                posX = dx;


                bigImage.style.transform =
                    `translate(${dx}px,0) scale(1)`;


                bigImage.style.opacity =
                    1 -
                    Math.min(
                        Math.abs(dx) / 300,
                        0.5
                    );

            }

        }

    },
    {passive:false}
);


/* =========================================================
   Touch End
========================================================= */

bigImage.addEventListener(
    "touchend",
    e=>{


        /*
         * 如果還有手指留在畫面上，
         * 代表剛結束的是雙指操作。
         * 不要把它當成滑頁。
         */

        if(e.touches.length > 0){

            if(e.touches.length === 1){

                const t =
                    e.touches[0];


                lastTouchX =
                    t.clientX;

                lastTouchY =
                    t.clientY;

            }


            return;

        }


        const now =
            Date.now();


        const changedTouch =
            e.changedTouches[0];


        const dx =
            changedTouch.clientX
            - touchStartX;


        /* =================================================
           雙擊
        ================================================= */

        if(now - lastTapTime < 250){

            e.preventDefault();


            if(scale === 1){

                scale = 2;

            }else{

                scale = 1;

                posX = 0;

                posY = 0;

            }


            clamp();

            updateTransform();


            lastTapTime = 0;

            isTap = false;

            isSwiping = false;


            return;

        }


        lastTapTime =
            now;


        /* =================================================
           背景關閉
        ================================================= */

        if(
            scale === 1 &&
            isTap
        ){

            if(e.target === viewer){

                closeViewer();

            }


            return;

        }


        /* =================================================
           左右滑頁
        ================================================= */

        if(
            scale === 1 &&
            isSwiping
        ){

            if(dx > 80){

                goPrev();

            }else if(dx < -80){

                goNext();

            }else{

                posX = 0;

                bigImage.style.opacity =
                    1;

                updateTransform();

            }


            return;

        }


        /* =================================================
           放大狀態
        ================================================= */

        if(scale > 1){

            clamp();

            updateTransform();

        }

    }
);


/* =========================================================
   桌機背景關閉
========================================================= */

viewer.addEventListener("click",e=>{

    if(
        e.target === bigImage ||
        e.target.id === "prev" ||
        e.target.id === "next" ||
        e.target.id === "close" ||
        e.target === caption ||
        e.target === counter
    ){

        return;

    }


    closeViewer();

});


</script>
