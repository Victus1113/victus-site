<!DOCTYPE html>
<html lang="zh">

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta charset="UTF-8">
<title>Doodle</title>
<link rel="stylesheet" href="style.css">

<style>

/* ===== Viewer 改回全螢幕 ===== */
#viewer{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,0.95);

    display:none;
    align-items:center;
    justify-content:center;

    z-index:9999;
}

/* 圖片完整顯示 */
#viewer img{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;

    transition:0.3s;
}

/* ===== 箭頭 ===== */
#prev, #next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);

    font-size:40px;
    color:white;

    padding:20px;
    cursor:pointer;

    opacity:0.6;
    z-index:10;
}

/* ⭐ 關鍵：確保一定在畫面內 */
#prev{ left:5vw; }
#next{ right:5vw; }

#prev:hover, #next:hover{
    opacity:1;
}

/* ===== 關閉 ===== */
#close{
    position:absolute;
    top:20px;
    right:20px;

    font-size:28px;
    color:white;

    cursor:pointer;
}

/* ===== 頁數 ===== */
#counter{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);

    color:#ccc;
}

/* ===== 手機優化 ===== */
@media (max-width:768px){

#viewer img{
    max-width:100%;
    max-height:75vh;
}

/* 箭頭縮小但一定可見 */
#prev, #next{
    font-size:30px;
    padding:10px;
}

#prev{ left:10px; }
#next{ right:10px; }

}

</style>
</head>

<body>

<div class="page">

<h1>插圖 DOODLE</h1>
<p>角色塗鴉＆小漫畫。</p>

<h2>插圖</h2>
<div class="gallery">
    <img src="img/members.jpg">
    <img src="img/sh.jpg">
</div>

<h2>漫畫</h2>
<div class="gallery">
    <img src="img/humor.jpg">
    <img src="img/s3x.jpg">
    <img src="img/cure.jpg">
    <img src="img/speachless.jpg">
</div>

<a class="back" href="index.html">← 回到首頁</a>

</div>

<!-- Viewer -->
<div id="viewer">

    <div id="close">✕</div>

    <div id="prev">‹</div>

    <img id="bigImage">

    <div id="next">›</div>

    <div id="counter">1 / 1</div>

</div>

<script>

const viewer = document.getElementById("viewer");
const bigImage = document.getElementById("bigImage");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const closeBtn = document.getElementById("close");
const counter = document.getElementById("counter");

const galleries = document.querySelectorAll(".gallery");

//手機縮放//
let baseScale = 1;       // ⭐ 真正縮放基準
let pinchStartScale = 1; // ⭐ 手勢開始時的 scale
    
let currentIndex = 0;
let currentGallery = [];

let blockClick = false;
let previewPrev = new Image();
let previewNext = new Image();

/* ===== 狀態 ===== */
let scale = 1;
let posX = 0;
let posY = 0;

let isDragging = false;
let startX = 0;
let startY = 0;

let initialDistance = null;
let touchStartX = 0;

let isSwiping = false;
let lastTapTime = 0;

/* ===== 更新 ===== */
function updateTransform(){
    bigImage.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
}

/* ===== 邊界 ===== */
function clamp(){

    const imgWidth = bigImage.naturalWidth * scale;
    const imgHeight = bigImage.naturalHeight * scale;

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const maxX = Math.max(0, (rect.width - vw) / 2);
    const maxY = Math.max(0, (rect.height - vh) / 2);

    posX = Math.min(maxX, Math.max(-maxX, posX));
    posY = Math.min(maxY, Math.max(-maxY, posY));
}

/* ===== 切圖 ===== */
function goPrev(){
    currentIndex = (currentIndex-1+currentGallery.length)%currentGallery.length;
    showImage();
}
function goNext(){
    currentIndex = (currentIndex+1)%currentGallery.length;
    showImage();
}

/* ===== 開啟 ===== */
galleries.forEach(gallery=>{
    const imgs = gallery.querySelectorAll("img");

    imgs.forEach((img,index)=>{
        img.onclick = (e)=>{

            if(blockClick) return; // ⭐ 防止穿透

            currentGallery = imgs;
            currentIndex = index;

            showImage();
            viewer.style.display="flex";
            document.body.style.overflow="hidden";
        }
    });
});

/* ===== 顯示 ===== */
function showImage(){

    bigImage.src = currentGallery[currentIndex].src;

    const prevIndex = (currentIndex-1+currentGallery.length)%currentGallery.length;
    const nextIndex = (currentIndex+1)%currentGallery.length;

    previewPrev.src = currentGallery[prevIndex].src;
    previewNext.src = currentGallery[nextIndex].src;

    scale = 1;
    posX = 0;
    posY = 0;

    viewer.style.backgroundImage = "";
    bigImage.style.opacity = 1;

    updateTransform();
    counter.innerText = (currentIndex+1)+" / "+currentGallery.length;
}

/* ===== 關閉手機的圖片 ===== */
function closeViewer(){

    blockClick = true; // ⭐ 關鍵：開始擋 click

    viewer.style.display="none";
    document.body.style.overflow="";
    viewer.style.backgroundImage = "";

    /* ⭐ 300ms 後恢復 */
    setTimeout(()=>{
        blockClick = false;
    }, 300);
}

/* ===== 關閉按鈕 ===== */
closeBtn.onclick = e=>{
    e.stopPropagation();
    closeViewer();
};

/* ===== 電腦箭頭 ===== */
prev.onclick = e=>{
    e.stopPropagation();
    if(scale === 1) goPrev();
};

next.onclick = e=>{
    e.stopPropagation();
    if(scale === 1) goNext();
};

/* ===== 鍵盤（修好） ===== */
document.addEventListener("keydown", e=>{
    if(viewer.style.display !== "flex") return;
    if(scale > 1) return;

    if(e.key === "ArrowLeft") goPrev();
    if(e.key === "ArrowRight") goNext();
});

/* ===== 滾輪縮放 ===== */
bigImage.addEventListener("wheel", e=>{
    e.preventDefault();

    let oldScale = scale;
    scale += e.deltaY<0?0.15:-0.15;
    scale = Math.min(Math.max(1,scale),4);

    const rect = bigImage.getBoundingClientRect();
    const ratio = scale/oldScale;

    posX -= (e.clientX-rect.left-rect.width/2)*(ratio-1);
    posY -= (e.clientY-rect.top-rect.height/2)*(ratio-1);

    clamp();
    updateTransform();
});

/* ===== 滑鼠拖曳 ===== */
bigImage.addEventListener("mousedown", e=>{
    if(scale<=1) return;
    isDragging=true;
    startX=e.clientX;
    startY=e.clientY;
});

window.addEventListener("mousemove", e=>{
    if(!isDragging) return;

    let dx=e.clientX-startX;
    let dy=e.clientY-startY;

    posX+=dx;
    posY+=dy;

    startX=e.clientX;
    startY=e.clientY;

    clamp();
    updateTransform();
});

window.addEventListener("mouseup", ()=>{
    isDragging=false;
});

/* ===== 手機觸控（最終穩定修正版） ===== */

bigImage.addEventListener("touchstart", e=>{

    if(e.touches.length === 1){
        const t = e.touches[0];

        startX = t.clientX;
        startY = t.clientY;
        touchStartX = t.clientX;

        isSwiping = false;
        isTap = true;
    }

    if(e.touches.length === 2){

        let dx = e.touches[0].clientX - e.touches[1].clientX;
        let dy = e.touches[0].clientY - e.touches[1].clientY;

        initialDistance = Math.sqrt(dx*dx + dy*dy);

        pinchStartScale = scale; // ⭐ 記住起始縮放
        isTap = false;
    }
});

bigImage.addEventListener("touchmove", e=>{

    /* ===== 雙指縮放 ===== */
    if(e.touches.length === 2){
        e.preventDefault();

        let t1 = e.touches[0];
        let t2 = e.touches[1];

        let dx = t1.clientX - t2.clientX;
        let dy = t1.clientY - t2.clientY;

        let distance = Math.sqrt(dx*dx + dy*dy);

        let scaleFactor = distance / initialDistance;

        // ⭐ 核心：用「起始 scale」算
        let newScale = pinchStartScale * scaleFactor;
        newScale = Math.min(Math.max(1, newScale), 4);

        /* ⭐ 中心點補償（關鍵） */
        let t1 = e.touches[0];
        let t2 = e.touches[1];

        let centerX = (t1.clientX + t2.clientX) / 2;
        let centerY = (t1.clientY + t2.clientY) / 2;

        const rect = bigImage.getBoundingClientRect();

        let offsetX = centerX - rect.left - rect.width / 2;
        let offsetY = centerY - rect.top - rect.height / 2;

        let scaleRatio = newScale / scale;

        posX -= offsetX * (scaleRatio - 1);
        posY -= offsetY * (scaleRatio - 1);

        scale = newScale;

        clamp();
        updateTransform();

        return; // ⭐ 阻止下面邏輯
    }

    /* ===== 單指 ===== */
    if(e.touches.length === 1){

        const t = e.touches[0];

        let dx = t.clientX - touchStartX;

        /* ===== 放大拖曳 ===== */
        if(scale > 1){
            e.preventDefault();

            let moveX = t.clientX - startX;
            let moveY = t.clientY - startY;

            posX += moveX;
            posY += moveY;

            startX = t.clientX;
            startY = t.clientY;

            clamp();
            updateTransform();
            return;
        }

        /* ===== 滑頁 ===== */
        if(Math.abs(dx) > 30){
            isSwiping = true;
            isTap = false;
        }

        if(scale === 1 && isSwiping){
            posX = dx;

            bigImage.style.transform =
                `translate(${dx}px,0) scale(1)`;

            bigImage.style.opacity =
                1 - Math.min(Math.abs(dx)/300, 0.5);
        }
    }

}, {passive:false});

/* ===== touchend（最終穩定版） ===== */
bigImage.addEventListener("touchend", e=>{

    const now = Date.now();
    const dx = e.changedTouches[0].clientX - touchStartX;

    /* ===== 雙擊 ===== */
    if(now - lastTapTime < 250){

        if(scale === 1){
            scale = 2;
        }else{
            scale = 1;
            posX = 0;
            posY = 0;
        }

        clamp();
        updateTransform();

        lastTapTime = 0;
        return;
    }

    lastTapTime = now;

    /* ===== 點擊關閉 ===== */
    if(scale === 1 && isTap){
        if(e.target === viewer){
            closeViewer();
        }
        return;
    }

    /* ===== 滑頁 ===== */
    if(scale === 1 && isSwiping){

        if(dx > 80) goPrev();
        else if(dx < -80) goNext();
        else{
            posX = 0;
            bigImage.style.opacity = 1;
            updateTransform();
        }

        return;
    }

    // ⭐ ⭐ ⭐ 關鍵：不要再重設 posX !!!
});
    
/* ===== 點背景關閉（桌機） ===== */
viewer.addEventListener("click", e=>{
    if(
        e.target === bigImage ||
        e.target.id === "prev" ||
        e.target.id === "next" ||
        e.target.id === "close"
    ) return;

    closeViewer();
});

</script>
</body>
</html>
