<!DOCTYPE html>
<html lang="zh">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    
<meta charset="UTF-8">
<title>Doodle</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="page">

<h1>插圖 DOODLE</h1>

<p>
角色塗鴉＆小漫畫。
</p>

<h2>插圖</h2>

<div class="gallery">
    <img src="img/members.jpg">
    <img src="img/sh.jpg">
</div>

<h2>漫畫</h2>

<div class="gallery">
    <img src="img/humor.jpg">
    <img src="img/s3x.jpg">
    <img src="img/cure.jpg">
    <img src="img/speachless.jpg">
</div>

<a class="back" href="index.html">← 回到首頁</a>

</div>


<!-- 圖片放大查看器 -->
<div id="viewer">
    
    <div id="close">✕</div>
    
    <div id="prev">‹</div>

    <img id="bigImage">

    <div id="next">›</div>

    <div id="counter">1 / 1</div>

</div>


<script>
    
const closeBtn = document.getElementById("close");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const counter = document.getElementById("counter");
    
const galleries = document.querySelectorAll(".gallery");
const viewer = document.getElementById("viewer");
const bigImage = document.getElementById("bigImage");

let currentIndex = 0;
let currentGallery = [];

/* 點圖片 */
galleries.forEach(gallery => {

    const imgs = gallery.querySelectorAll("img");

    imgs.forEach((img, index) => {

        img.onclick = function(){

            currentGallery = imgs;   // ⭐ 記住是哪一區
            currentIndex = index;

            showImage();
            viewer.style.display = "flex";
            
            document.body.style.overflow = "hidden"; // ⭐ 加這行
            
            viewer.style.display = "none";
            
            document.body.style.overflow = "";
        }

    });

});


viewer.addEventListener("click", function(e){

    // 點圖片 → 不動
    if(e.target === bigImage) return;

    // 點箭頭 / X → 不在這裡處理
    if(e.target.id === "prev" || e.target.id === "next" || e.target.id === "close") return;

    // 👉 點黑背景 → 關閉（你要的功能）
    if(e.target === viewer){
        viewer.style.display = "none";
        return;
    }

    // 👉 點左右區域 → 切換
    const x = e.clientX;
    const width = window.innerWidth;

    if(x < width / 2){
        currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
    }else{
        currentIndex = (currentIndex + 1) % currentGallery.length;
    }

    showImage();
});

/* 點 X 關閉 */

closeBtn.onclick = function(e){
    e.stopPropagation();   // ⭐ 不影響背景點擊
    viewer.style.display = "none";
}    


/* 👉 手機滑動 */
let startX = 0;

viewer.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

viewer.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;

    if(endX - startX > 50){
        currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
        showImage();
    }

    if(startX - endX > 50){
        currentIndex = (currentIndex + 1) % currentGallery.length;
        showImage();
    }
});

/* 左右按鈕 */

prev.onclick = function(e){
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
    showImage();
}

next.onclick = function(e){
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % currentGallery.length;
    showImage();
}

document.addEventListener("keydown", function(e){

    if(viewer.style.display !== "flex") return;

    if(e.key === "ArrowLeft"){
        currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
        showImage();
    }

    if(e.key === "ArrowRight"){
        currentIndex = (currentIndex + 1) % currentGallery.length;
        showImage();
    }

});

let scale = 1;

bigImage.addEventListener("wheel", function(e){
    e.preventDefault();

    if(e.deltaY < 0){
        scale += 0.1;
    }else{
        scale -= 0.1;
    }

    scale = Math.min(Math.max(1, scale), 3);

    bigImage.style.transform = "scale(" + scale + ")";
});

let initialDistance = null;

viewer.addEventListener("touchmove", function(e){

    if(e.touches.length === 2){

        e.preventDefault();

        let dx = e.touches[0].clientX - e.touches[1].clientX;
        let dy = e.touches[0].clientY - e.touches[1].clientY;

        let distance = Math.sqrt(dx*dx + dy*dy);

        if(!initialDistance){
            initialDistance = distance;
        }

        let scaleChange = distance / initialDistance;

        let newScale = scale * scaleChange;

        newScale = Math.min(Math.max(1, newScale), 3);

        bigImage.style.transform = "scale(" + newScale + ")";
    }

}, { passive:false });

viewer.addEventListener("touchend", function(){
    initialDistance = null;
});

function showImage(){
    bigImage.src = currentGallery[currentIndex].src;

    scale = 1; // ⭐ 重置縮放
    bigImage.style.transform = "scale(1)";

    counter.innerText = (currentIndex + 1) + " / " + currentGallery.length;
}
    
</script>

</body>
</html>
