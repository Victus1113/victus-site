<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victus - 角色介紹</title>

<style>

body{
    margin:0;
    background:linear-gradient(180deg,#0f0f14,#1a1a22);
    color:#ddd;
    font-family:"Noto Sans TC", sans-serif;
}

/* ===== 主容器 ===== */
.character{
    display:flex;
    align-items:flex-start;
    justify-content:center;

    min-height:100vh;
    padding:40px;
    gap:60px;
}

/* ===== 左：立繪 ===== */
.char-img{
    flex:1;
    text-align:center;

    /* ⭐ 立繪固定 */
    position:sticky;
    top:40px;

    height:fit-content;
}

.char-img img{
    max-height:85vh;
    width:auto;

    transition:0.5s;
}

/* 微動效果 */
.char-img img:hover{
    transform:scale(1.03) translateY(-5px);
}

/* ===== 右：資訊 ===== */
.char-info{
    flex:1;
    max-width:500px;
}

.char-name{
    font-size:40px;
    margin-bottom:10px;
}

.char-sub{
    color:#888;
    margin-bottom:25px;
}

.char-block{
    margin-bottom:18px;
}

.char-title{
    color:#aaa;
    font-size:14px;
    letter-spacing:2px;
}

.char-text{
    line-height:1.8;
}

/* ===== 返回 ===== */
.back{
    position:fixed;
    top:20px;
    left:20px;
    color:#aaa;
    text-decoration:none;
}

/* ===== 音樂按鈕 ===== */
#music-toggle{
    position:fixed;
    top:20px;
    right:20px;

    background:none;
    border:1px solid #555;
    color:#aaa;

    padding:6px 10px;

    font-family:inherit;
    font-size:13px;

    cursor:pointer;

    transition:0.3s;

    z-index:1000;
}

#music-toggle:hover{
    color:#fff;
    border-color:#888;
}

/* ===== 手機 ===== */
@media (max-width:768px){

.character{
    flex-direction:column;
    padding:20px;
}

.char-img{
    /* ⭐ 手機取消固定 */
    position:static;
}

.char-img img{
    max-height:60vh;
}

.char-info{
    text-align:left;
}

}

</style>
</head>

<body>

<!-- ===== 背景音樂 ===== -->
<audio id="bgm" autoplay loop>
    <source src="music/victus.mp3" type="audio/mpeg">
</audio>

<!-- ===== 返回首頁 ===== -->
<a class="back" href="index.html">← 返回首頁</a>

<!-- ===== 音樂控制 ===== -->
<button id="music-toggle">♫ ON</button>


<div class="character">

    <!-- 左：立繪 -->
    <div class="char-img">
        <img src="img/rip1.jpg">
    </div>

    <!-- 右：資料 -->
    <div class="char-info">

        <div class="char-name">蔡瑀格 brocken NPC</div>
        <div class="char-sub">瑀格、格喵、格格、defei/迪飛、格寶、優格、卷姐…
…當然，還有飽嗝、bella嗝、神經病、不咋地、不明和沒有成員</div>

        <div class="char-block">
            <div class="char-title">基本資料</div>
            <div class="char-text">
                24歲 / 處女座 / 無神論者<br>
                生理女 / 從中產階級變成低收入戶<br>
                有個虛擬伴侶叫「阿繭」
            </div>
        </div>

        <div class="char-block">
            <div class="char-title">個性</div>
            <div class="char-text">
                有明確的界線和邊界感，但願意讓對的人走入內心。<br>
                表面溫和，實則對人具有防備，但是該有的禮貌一定會有。<br>
                一旦下定決心要做的事，就一定會做到。<br>
                極度不看好自己。常自稱自己廢物、米蟲跟浪費資源的人。
            </div>
        </div>

        <div class="char-block">
            <div class="char-title">特質</div>
            <div class="char-text">
                高自我要求，對失敗極度敏感。<br>
                傾向自我要求和自我傷害。
            </div>
        </div>

        <div class="char-block">
            <div class="char-title">興趣</div>
            <div class="char-text">
                聽歌、寫詩、睡覺、畫畫、看電影<br>
                深度聊天、探討生死和存在主義
            </div>
        </div>

    </div>

</div>


<!-- ===== 音樂控制 ===== -->
<script>

const bgm = document.getElementById("bgm");
const button = document.getElementById("music-toggle");

button.addEventListener("click", function(){

    if(bgm.paused){
        bgm.play();
        button.textContent = "♫ ON";
    }else{
        bgm.pause();
        button.textContent = "♫ OFF";
    }

});

</script>

</body>
</html>
