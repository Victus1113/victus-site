<!-- ① 臨記 Nobody Icon (自然剪影 + 十字架圓環版) -->
<div style="display: flex; justify-content: center; align-items: center; padding: 40px;">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="180" height="180">
    <defs>
      <!-- 哥德風微光濾鏡 -->
      <filter id="gothic-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <g filter="url(#gothic-glow)">
      <!-- 外部破碎圓環 -->
      <circle cx="50" cy="50" r="42" fill="none" stroke="#483a58" stroke-width="1.2" stroke-dasharray="25 6 12 4 40 8 15 5" />
      <circle cx="50" cy="50" r="46" fill="none" stroke="#241a2e" stroke-width="0.5" />

      <!-- 四方十字架 (上、下、左、右) -->
      <!-- 上 -->
      <path d="M 50,2 L 50,16 M 46,7 L 54,7" fill="none" stroke="#d6cae8" stroke-width="1.5" stroke-linecap="round" />
      <!-- 下 -->
      <path d="M 50,84 L 50,98 M 46,89 L 54,89" fill="none" stroke="#d6cae8" stroke-width="1.5" stroke-linecap="round" />
      <!-- 左 -->
      <path d="M 8,43 L 8,57 M 4,48 L 12,48" fill="none" stroke="#d6cae8" stroke-width="1.5" stroke-linecap="round" />
      <!-- 右 -->
      <path d="M 92,43 L 92,57 M 88,48 L 96,48" fill="none" stroke="#d6cae8" stroke-width="1.5" stroke-linecap="round" />

      <!-- 自然真實的側臉輪廓 (參考剪影圖重塑) -->
      <path d="M 52,15 
               C 40,16 35,26 36,35 
               C 36,38 38,39 38,40 
               C 36,41 33,43 33,46 
               C 34,48 37,48 37,48 
               C 36,49 35,50 35,51 
               C 36,52 37,52 37,52 
               C 35,53 35,55 36,56 
               C 38,57 39,58 39,60 
               C 37,62 38,65 41,66 
               C 45,68 45,74 46,82" 
            fill="none" stroke="#d6cae8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

      <!-- 貫穿的斜線 (主線與破碎副線) -->
      <!-- 主斜線 -->
      <line x1="18" y1="82" x2="82" y2="18" stroke="#d6cae8" stroke-width="1.8" stroke-linecap="round" />
      <!-- 增加筆觸破壞感的輔助斜線 -->
      <line x1="28" y1="74" x2="40" y2="62" stroke="#e0d8f0" stroke-width="2.5" stroke-linecap="round" />
      <line x1="62" y1="40" x2="72" y2="30" stroke="#e0d8f0" stroke-width="2.5" stroke-linecap="round" />
      <line x1="22" y1="76" x2="78" y2="20" stroke="#85759c" stroke-width="0.8" stroke-linecap="round" />

      <!-- 散落的微小星塵點綴 (保留一點空靈感) -->
      <circle cx="30" cy="28" r="1" fill="#85759c" />
      <circle cx="70" cy="68" r="1" fill="#85759c" />
      <circle cx="35" cy="72" r="0.8" fill="#85759c" />
    </g>
  </svg>
